name: CI - Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8 black bandit

    - name: Run linting (flake8)
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true

    - name: Run code formatting check (black)
      run: |
        black --check . || echo "Note: Code formatting issues found (non-blocking)"
      continue-on-error: true

    - name: Run security checks (bandit)
      run: |
        bandit -r . -f json -o bandit-report.json || true
        bandit -r . -f txt
      continue-on-error: true

    - name: Run unit tests
      run: |
        pytest tests/ -v --cov=. --cov-report=xml --cov-report=html || true

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
      continue-on-error: true

    - name: Check requirements.txt for known vulnerabilities
      run: |
        pip install safety
        safety check --json || true
      continue-on-error: true

    - name: Validate environment configuration
      run: python -c "import app; print('✓ Flask app loads successfully')"

    - name: Summary Report
      run: |
        echo "========================================="
        echo "CI Build & Test Summary"
        echo "========================================="
        echo "✓ Python version: ${{ matrix.python-version }}"
        echo "✓ Dependencies installed"
        echo "✓ Linting completed"
        echo "✓ Security checks completed"
        echo "✓ Tests completed"
        echo "========================================="
        echo "Next Step: CD pipeline will deploy to AWS"
        echo "========================================="

  # This job triggers the CD workflow
  trigger-deployment:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Trigger CD Workflow (Auto-Deploy on Main Branch)
      run: |
        echo "CI passed successfully!"
        echo "Auto-triggering CD workflow for main branch deployment..."

    - name: Dispatch CD Workflow
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.actions.createWorkflowDispatch({
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: 'cd.yml',
            ref: 'main',
            inputs: {
              deploy_target: 'production',
              skip_tests: 'false'
            }
          })
      continue-on-error: true
