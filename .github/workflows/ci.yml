name: CI - Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 black bandit

      - name: Run code formatting check (black)
        continue-on-error: true
        run: black --check .

      - name: Run linting (flake8)
        continue-on-error: true
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run security checks (bandit)
        continue-on-error: true
        run: bandit -r . -f txt

      - name: Run unit tests
        run: pytest tests/ -v --cov=. --cov-report=xml --cov-report=html

      - name: Validate Flask app loads
        run: python -c "import app; print('Flask app loads successfully')"

      - name: Upload coverage reports
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

      - name: CI Summary
        run: |
          echo "========================================="
          echo "✅ CI PIPELINE COMPLETED"
          echo "========================================="
          echo "Python version: ${{ matrix.python-version }}"
          echo "Dependencies: ✓ Installed"
          echo "Tests: ✓ Completed"
          echo "========================================="
          echo "Deployment is manual-only; use the CD workflow button in GitHub Actions."
          echo "========================================="
